# Deploys main to the LXC. Only runs once the repo lives on Gitea with a runner.
# Secrets: DEPLOY_HOST, DEPLOY_SSH_KEY (key for user "deploy" on the LXC).
name: deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: lxc-docker
    container: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: node --experimental-transform-types --no-warnings --import ./tests/harness/register.mjs tests/node_server.test.ts
      - run: npm run build:node
      - name: Ship
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          apt-get update -qq && apt-get install -y -qq rsync openssh-client >/dev/null
          install -m 600 /dev/null ~/key && printf '%s\n' "$KEY" > ~/key
          SSH="ssh -i ~/key -o StrictHostKeyChecking=accept-new"
          rsync -az --delete -e "$SSH" dist/ "deploy@$HOST:/srv/sparkle/app/dist/"
          rsync -az --delete -e "$SSH" db/migrations/ "deploy@$HOST:/srv/sparkle/app/db/migrations/"
          $SSH "deploy@$HOST" sudo /usr/bin/systemctl restart sparkle
